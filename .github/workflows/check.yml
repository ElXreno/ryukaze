# On every push and pull request: the formatting, clippy, and what
# `nix flake check` covers (the package with its tests, the module in a VM).
# The tools come from the flake's own nixpkgs, so they don't drift.
name: check

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # The VM test needs KVM: the runner has it, but not for its user.
      - name: Open KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            system-features = nixos-test benchmark big-parallel kvm

      - name: Formatting
        run: |
          nix develop -c cargo fmt --check
          nix run --inputs-from . nixpkgs#nixfmt -- --check flake.nix nix/*.nix

      - name: Clippy
        run: nix develop -c cargo clippy --workspace --all-targets -- -D warnings

      - name: Package, tests and the module in a VM
        run: nix flake check -L
