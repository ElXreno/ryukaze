<?xml version="1.0"?>
<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<!-- System bus policy for ryukazed. Everyone may read the status; only root
     may change the EC. To let a user change it too, add a policy for them
     (the NixOS module does this for its `users` option):

       <policy user="alice">
         <allow send_destination="io.github.kontonkara.ryukaze"/>
       </policy>
-->
<busconfig>
  <policy user="root">
    <allow own="io.github.kontonkara.ryukaze"/>
    <allow send_destination="io.github.kontonkara.ryukaze"/>
  </policy>

  <policy context="default">
    <allow send_destination="io.github.kontonkara.ryukaze"
           send_interface="io.github.kontonkara.ryukaze1"
           send_member="Status"/>
    <allow send_destination="io.github.kontonkara.ryukaze"
           send_interface="org.freedesktop.DBus.Introspectable"/>
    <allow send_destination="io.github.kontonkara.ryukaze"
           send_interface="org.freedesktop.DBus.Peer"/>
  </policy>
</busconfig>
