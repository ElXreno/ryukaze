[workspace]
resolver = "3"
members = [
  "crates/core",
  "crates/daemon",
  "crates/gui",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/kontonkara/ryukaze"

[workspace.dependencies]
ryukaze-core = { path = "crates/core" }
anyhow = "1"
# Software rendering only: a GPU renderer opens Vulkan/GL, and on a hybrid
# laptop that can wake the discrete GPU for a small settings window.
iced = { version = "0.14", default-features = false, features = ["tiny-skia", "wayland", "x11", "tokio", "crisp"] }
rustix = { version = "1.1", features = ["net"] }
serde = { version = "1", features = ["derive"] }
tempfile = "3"
toml = "1.1"
tokio = { version = "1.53", features = ["macros", "rt", "sync"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
zbus = { version = "5.19", default-features = false, features = ["tokio"] }
zvariant = "5.15"

[profile.release]
lto = "thin"
strip = true
