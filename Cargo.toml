[workspace]
resolver = "3"
members = [
  "crates/core",
  "crates/daemon",
  "crates/gui",
]

[workspace.package]
version = "0.3.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/kontonkara/ryukaze"

[workspace.dependencies]
ryukaze-core = { path = "crates/core" }
anyhow = "1"
futures-util = { version = "0.3", default-features = false }
# Software rendering only: a GPU renderer opens Vulkan/GL, and on a hybrid
# laptop that can wake the discrete GPU for a small settings window.
iced = { version = "0.14", default-features = false, features = ["wgpu", "tiny-skia", "wayland", "x11", "tokio", "crisp", "canvas", "advanced"] }
# The OSD draws iced off screen, for a layer-shell surface of its own.
iced_runtime = "0.14"
ksni = { version = "0.3.6", default-features = false, features = ["tokio"] }
# 0.45 draws with the same tiny-skia as iced.
resvg = { version = "0.45", default-features = false }
rustix = "1.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# The OSD's layer shell, as winit has it: no xkbcommon.
smithay-client-toolkit = { version = "0.19.2", default-features = false, features = ["calloop"] }
tempfile = "3"
toml = "1.1"
tokio = { version = "1.53", features = ["macros", "rt", "signal", "sync", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
zbus = { version = "5.19", default-features = false, features = ["tokio"] }
zvariant = "5.15"

[profile.release]
lto = "thin"
strip = true
